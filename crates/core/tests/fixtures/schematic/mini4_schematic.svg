<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Hand-written test fixture: 0.6 x 0.4 in = 6 x 4 grid units (1 user unit = 0.01 in), pins on the grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0.6in" height="0.4in" viewBox="0 0 60 40">
 <g id="schematic" fill="none" stroke="#000000" stroke-width="1">
  <rect x="10" y="0" width="40" height="40" fill="#ffffff"/>
  <line id="a_pin" x1="0" y1="10" x2="10" y2="10"/>
  <line id="b_pin" x1="0" y1="30" x2="10" y2="30"/>
  <line id="c_pin" x1="50" y1="10" x2="60" y2="10"/>
  <line id="d_pin" x1="50" y1="30" x2="60" y2="30"/>
 </g>
</svg>
